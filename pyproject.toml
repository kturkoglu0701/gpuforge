[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpuforge"
version = "0.3.5"
description = "Self-contained native-Linux daemon: detect AI IDE sessions, GPU-first scheduling, CPU/RAM only when needed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GPUForge" }]
dependencies = [
  "psutil>=6.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
gpuforge = "gpuforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gpuforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=gpuforge --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
omit = ["gpuforge/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
